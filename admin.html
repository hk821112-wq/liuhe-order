<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#fff8ed">
  <title>六合牛軋糖｜訂單後台</title>
  <link rel="stylesheet" href="./admin.css">
  <link rel="stylesheet" href="./admin-password.css">
</head>
<body>
  <main class="admin-shell">
    <header class="admin-head">
      <div><p>六合牛軋糖店舖</p><h1>訂單後台</h1></div>
      <div class="admin-head-actions">
        <button id="passwordButton" class="text-button" hidden>修改密碼</button>
        <button id="logoutButton" class="text-button" hidden>登出</button>
      </div>
    </header>
    <section id="loginPanel" class="login-panel">
      <p>商家專用</p><h2>登入管理訂單</h2>
      <form id="loginForm"><label>管理密碼<input name="pin" type="password" inputmode="numeric" autocomplete="current-password" required></label><button type="submit">登入後台</button><p id="loginError" class="error" role="alert"></p></form>
    </section>
    <section id="dashboard" hidden>
      <div id="stats" class="stats"></div>
      <nav class="filters" aria-label="訂單篩選"><button data-filter="waiting" data-active="true">等待出貨</button><button data-filter="shipped">已出貨</button><button data-filter="cancelled">已取消</button></nav>
      <div class="toolbar"><p id="orderCount"></p><button id="refreshButton" class="text-button">重新整理</button></div>
      <div id="orders" class="orders"></div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="passwordDialog" class="password-dialog">
    <form id="passwordForm" method="dialog">
      <div class="password-head"><div><p>帳號安全</p><h2>修改後台密碼</h2></div><button class="dialog-close" type="button" id="passwordClose" aria-label="關閉">×</button></div>
      <label>目前密碼<input name="currentPin" type="password" inputmode="numeric" autocomplete="current-password" required></label>
      <label>新密碼<input name="newPin" type="password" inputmode="numeric" autocomplete="new-password" minlength="4" maxlength="12" pattern="[0-9]{4,12}" required><small>請輸入 4 到 12 位數字</small></label>
      <label>再次輸入新密碼<input name="confirmPin" type="password" inputmode="numeric" autocomplete="new-password" minlength="4" maxlength="12" pattern="[0-9]{4,12}" required></label>
      <p id="passwordError" class="error" role="alert"></p>
      <button class="password-submit" type="submit">確認修改密碼</button>
    </form>
  </dialog>
  <script src="./config.js"></script><script type="module" src="./admin.js"></script>
</body>
</html>
