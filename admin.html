<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#fff8ed"><title>六合牛軋糖｜訂單後台</title><link rel="stylesheet" href="./admin.css"></head><body>
<main class="admin-shell"><header class="admin-head"><div><p>六合牛軋糖店舖</p><h1>訂單後台</h1></div><button id="logoutButton" class="text-button" hidden>登出</button></header>
<section id="loginPanel" class="login-panel"><p>商家專用</p><h2>登入管理訂單</h2><form id="loginForm"><label>管理密碼<input name="pin" type="password" inputmode="numeric" autocomplete="current-password" required></label><button type="submit">登入後台</button><p id="loginError" class="error" role="alert"></p></form></section>
<section id="dashboard" hidden><div id="stats" class="stats"></div><nav class="filters" aria-label="訂單篩選"><button data-filter="waiting" data-active="true">等待出貨</button><button data-filter="shipped">已出貨</button><button data-filter="cancelled">已取消</button></nav><div class="toolbar"><p id="orderCount"></p><button id="refreshButton" class="text-button">重新整理</button></div><div id="orders" class="orders"></div></section>
</main><div id="toast" class="toast" role="status" hidden></div><script src="./config.js"></script><script type="module" src="./admin.js"></script></body></html>
