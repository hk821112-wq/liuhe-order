<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#b9360b" />
  <meta name="description" content="六合牛軋糖店舖 LINE 線上下單" />
  <title>六合牛軋糖｜線上下單</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./checkout.css" />
</head>
<body>
  <div id="app" aria-live="polite">
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">手作甜點 · 新鮮出貨</p>
          <h1 id="merchantName">六合牛軋糖</h1>
        </div>
        <button id="lineButton" class="line-login" type="button">
          <span class="line-mark">LINE</span><span id="lineLabel">LINE 登入</span>
        </button>
      </header>

      <section class="product-stage" aria-label="商品選擇">
        <div id="productTrack" class="product-track"></div>
        <div id="productDots" class="product-dots" aria-hidden="true"></div>
      </section>

      <section class="product-info">
        <div class="product-title-row">
          <div>
            <p id="productSpec" class="spec">200克</p>
            <h2 id="productName">載入商品中</h2>
          </div>
          <p id="productPrice" class="price">NT$—</p>
        </div>
        <p class="description">酥脆餅乾、軟 Q 內餡與果乾香氣，每一口都有豐富層次。</p>

        <div class="offer-row">
          <div><strong>任選 3 包優惠</strong><span id="bundlePrice">依店舖設定</span></div>
          <div class="stepper" aria-label="商品數量">
            <button id="minusButton" type="button" aria-label="減少一包">−</button>
            <output id="quantity">0</output>
            <button id="plusButton" type="button" aria-label="增加一包">＋</button>
          </div>
        </div>

        <div class="swipe-hint">左右滑動切換商品</div>
      </section>
    </main>

    <footer class="cartbar">
      <div><span id="cartCount">尚未選購</span><strong id="cartTotal">NT$0</strong></div>
      <button id="checkoutButton" type="button" disabled>前往結帳</button>
    </footer>
  </div>

  <dialog id="checkoutDialog" class="sheet-dialog">
    <form id="checkoutForm" method="dialog">
      <div class="sheet-handle"></div>
      <div class="sheet-head"><div><p class="eyebrow">確認資料</p><h2>完成你的訂單</h2><p class="sheet-note">填寫聯絡資料並選擇取貨方式</p></div><button class="icon-button" value="cancel" aria-label="關閉">×</button></div>
      <section class="form-section" aria-labelledby="contact-title"><h3 id="contact-title">聯絡人</h3><div class="field-grid"><label>真實姓名<input name="customerName" autocomplete="name" minlength="2" maxlength="30" required /></label><label>手機號碼<input name="phone" inputmode="tel" autocomplete="tel" pattern="09[0-9]{8}" placeholder="09xxxxxxxx" required /></label></div></section>
      <section class="form-section" aria-labelledby="delivery-title"><h3 id="delivery-title">配送方式</h3><div class="segmented"><label><input type="radio" name="delivery" value="7-11超商取貨" checked /><span>7-11 取貨</span></label><label><input type="radio" name="delivery" value="宅配到府" /><span>宅配到府</span></label></div>
      <div id="storeFields" class="store-picker"><div id="selectedStore" class="selected-store" hidden><div class="store-brand">7-ELEVEN</div><div><strong id="selectedStoreName"></strong><span id="selectedStoreDetail"></span></div></div><button id="selectStoreButton" class="secondary-button" type="button">選擇 7-11 門市</button><p class="field-help">將前往綠界電子地圖，選好門市後會自動返回。</p><input type="hidden" name="storeName" /><input type="hidden" name="storeCode" /><input type="hidden" name="storeAddress" /><input type="hidden" name="storeVerificationToken" /></div>
      <div id="homeFields" class="conditional-fields" hidden><label>完整宅配地址<input name="homeAddress" autocomplete="street-address" placeholder="縣市、區、路名、門牌與樓層" /></label></div></section>
      <section class="form-section" aria-labelledby="payment-title"><h3 id="payment-title">付款方式</h3><div class="segmented"><label><input type="radio" name="payment" value="7-11取貨付款" checked /><span>取貨付款</span></label><label><input type="radio" name="payment" value="轉帳付款" /><span>銀行轉帳</span></label></div></section>
      <section class="form-section optional-section"><label>訂單備註 <span>選填</span><textarea name="note" rows="2" maxlength="300" placeholder="有需要特別告知店家的事項嗎？"></textarea></label></section>
      <input class="honeypot" name="website" tabindex="-1" autocomplete="off" />
      <div class="checkout-total"><span>應付總額</span><strong id="dialogTotal">NT$0</strong></div>
      <button id="submitOrder" class="primary-button" type="submit">送出訂單</button>
      <p id="formError" class="error" role="alert"></p>
    </form>
  </dialog>

  <dialog id="successDialog" class="success-dialog">
    <div class="receipt-scene">
      <div class="success-check">✓</div>
      <div class="receipt">
        <p class="eyebrow">ORDER CONFIRMED</p><h2>下單成功</h2>
        <dl><div><dt>訂單編號</dt><dd id="successOrderNo"></dd></div><div><dt>商品數量</dt><dd id="successQty"></dd></div><div><dt>總金額</dt><dd id="successTotal"></dd></div></dl>
        <p id="successMessage"></p><button id="successClose" class="primary-button" type="button">完成</button>
      </div>
    </div>
  </dialog>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="./config.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
