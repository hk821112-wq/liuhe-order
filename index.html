<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#b9360b" />
  <meta name="description" content="六合牛軋糖店舖 LINE 線上下單" />
  <title>六合牛軋糖｜線上下單</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app" aria-live="polite">
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">手作甜點 · 新鮮出貨</p>
          <h1 id="merchantName">六合牛軋糖</h1>
        </div>
        <button id="lineButton" class="line-login" type="button">
          <span class="line-mark">LINE</span><span id="lineLabel">LINE 登入</span>
        </button>
      </header>

      <section class="product-stage" aria-label="商品選擇">
        <div id="productTrack" class="product-track"></div>
        <div id="productDots" class="product-dots" aria-hidden="true"></div>
      </section>

      <section class="product-info">
        <div class="product-title-row">
          <div>
            <p id="productSpec" class="spec">200克</p>
            <h2 id="productName">載入商品中</h2>
          </div>
          <p id="productPrice" class="price">NT$—</p>
        </div>
        <p class="description">酥脆餅乾、軟 Q 內餡與果乾香氣，每一口都有豐富層次。</p>

        <div class="offer-row">
          <div><strong>任選 3 包優惠</strong><span id="bundlePrice">依店舖設定</span></div>
          <div class="stepper" aria-label="商品數量">
            <button id="minusButton" type="button" aria-label="減少一包">−</button>
            <output id="quantity">0</output>
            <button id="plusButton" type="button" aria-label="增加一包">＋</button>
          </div>
        </div>

        <div class="swipe-hint">左右滑動切換商品</div>
      </section>
    </main>

    <footer class="cartbar">
      <div><span id="cartCount">尚未選購</span><strong id="cartTotal">NT$0</strong></div>
      <button id="checkoutButton" type="button" disabled>前往結帳</button>
    </footer>
  </div>

  <dialog id="checkoutDialog" class="sheet-dialog">
    <form id="checkoutForm" method="dialog">
      <div class="sheet-handle"></div>
      <div class="sheet-head"><div><p class="eyebrow">確認資料</p><h2>完成你的訂單</h2></div><button class="icon-button" value="cancel" aria-label="關閉">×</button></div>
      <label>真實姓名<input name="customerName" autocomplete="name" minlength="2" maxlength="30" required /></label>
      <label>手機號碼<input name="phone" inputmode="tel" autocomplete="tel" pattern="09[0-9]{8}" placeholder="09xxxxxxxx" required /></label>
      <fieldset><legend>配送方式</legend><label class="choice"><input type="radio" name="delivery" value="7-11超商取貨" checked />7-11 超商取貨</label><label class="choice"><input type="radio" name="delivery" value="宅配到府" />宅配到府</label></fieldset>
      <div id="storeFields" class="conditional-fields"><label>門市名稱<input name="storeName" /></label><label>門市店號<input name="storeCode" /></label><label>門市地址<input name="storeAddress" /></label></div>
      <div id="homeFields" class="conditional-fields" hidden><label>宅配地址<input name="homeAddress" autocomplete="street-address" /></label></div>
      <fieldset><legend>付款方式</legend><label class="choice"><input type="radio" name="payment" value="7-11取貨付款" checked />7-11 取貨付款</label><label class="choice"><input type="radio" name="payment" value="轉帳付款" />轉帳付款</label></fieldset>
      <label>備註<textarea name="note" rows="2" maxlength="300"></textarea></label>
      <input class="honeypot" name="website" tabindex="-1" autocomplete="off" />
      <div class="checkout-total"><span>應付總額</span><strong id="dialogTotal">NT$0</strong></div>
      <button id="submitOrder" class="primary-button" type="submit">送出訂單</button>
      <p id="formError" class="error" role="alert"></p>
    </form>
  </dialog>

  <dialog id="successDialog" class="success-dialog">
    <div class="receipt-scene">
      <div class="success-check">✓</div>
      <div class="receipt">
        <p class="eyebrow">ORDER CONFIRMED</p><h2>下單成功</h2>
        <dl><div><dt>訂單編號</dt><dd id="successOrderNo"></dd></div><div><dt>商品數量</dt><dd id="successQty"></dd></div><div><dt>總金額</dt><dd id="successTotal"></dd></div></dl>
        <p id="successMessage"></p><button id="successClose" class="primary-button" type="button">完成</button>
      </div>
    </div>
  </dialog>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="./config.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
