<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fff8ee">
  <title>我的訂單｜六合牛軋糖</title>
  <link rel="stylesheet" href="./orders.css?v=9"><link rel="stylesheet" href="./orders-v2.css?v=9">

</head>
<body>
  <header class="orders-header">
    <a class="back-link" href="./index.html" aria-label="返回商品頁">←</a>
    <div><p>六合牛軋糖</p><h1>我的訂單</h1></div>
    <button id="refreshButton" type="button">重新整理</button>
  </header>
  <main class="orders-main">
    <section id="loadingState" class="orders-loading"><div class="order-skeleton"><span></span><b></b><i></i><i></i></div><div class="order-skeleton"><span></span><b></b><i></i><i></i></div><p>正在確認你的訂單資料</p></section>
    <section id="emptyState" class="state-card" hidden><span class="state-icon">◎</span><h2>目前沒有訂單</h2><p>完成下單後，訂單進度會顯示在這裡。</p><a class="primary-link" href="./index.html">前往選購</a></section>
    <section id="errorState" class="state-card" hidden><span class="state-icon">!</span><h2>暫時無法讀取</h2><p id="errorMessage">請稍後再試一次。</p><button id="retryButton" class="primary-link" type="button">再試一次</button></section>
    <section id="ordersSection" hidden><p id="memberName" class="member-line"></p><div id="ordersList" class="orders-list"></div></section>
  </main>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="./config.js?v=9"></script>
